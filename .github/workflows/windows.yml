name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build environment
        run: python -m pip install -e ".[build]"
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Frozen application and release ZIP
        run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-Windows-x64
          path: |
            dist/*.zip
            dist/manifest.json
            dist/SHA256SUMS.txt
